name: Refresh profile assets

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

jobs:
  refresh-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run focused generator tests
        run: python -m unittest tests/test_generate_profile_assets.py

      - name: Refresh local profile cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_profile_assets.py --username fira6007 --output-dir assets

      - name: Commit refreshed assets
        run: |
          if git diff --quiet -- assets; then
            echo "No asset changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git commit -m "Refresh profile assets"
          git push
