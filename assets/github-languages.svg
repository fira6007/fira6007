<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Repository languages</title>
  <desc id="desc">Aggregated from public repository language breakdowns</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <style>
      text {
        font-family: "Segoe UI", Arial, sans-serif;
      }
      .label {
        fill: #93c5fd;
        font-size: 18px;
      }
      .value {
        fill: #f8fafc;
        font-size: 32px;
        font-weight: 700;
      }
      .title {
        fill: #f8fafc;
        font-size: 34px;
        font-weight: 700;
      }
      .subtitle {
        fill: #cbd5e1;
        font-size: 18px;
      }
      .muted {
        fill: #94a3b8;
        font-size: 15px;
      }
    </style>
  </defs>
  <rect width="900" height="420" rx="28" fill="url(#bg)" />
  <rect x="1.5" y="1.5" width="897" height="417" rx="26.5" fill="none" stroke="url(#edge)" stroke-width="3" opacity="0.95" />
  <text class="title" x="42" y="64">Repository languages</text>
  <text class="subtitle" x="42" y="96">Aggregated from public repository language breakdowns</text>
  
  <rect x="42" y="136" width="816" height="212" rx="24" fill="#0f172a" stroke="#334155" stroke-width="1.1" />
  <text class="value" x="42" y="210">Temporarily unavailable</text>
  <text class="subtitle" x="42" y="248">Repository language data could not be fetched during this refresh.</text>
  <text class="muted" x="42" y="378">See https://github.com/fira6007 and the repositories tab for live public data.</text>
</svg>
