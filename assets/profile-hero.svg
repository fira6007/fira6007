<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Firaol profile hero banner</title>
  <desc id="desc">A blue, cyan, and purple banner introducing Firaol as a software engineer focused on resilient software, backend architecture, and real-world impact.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="55%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
  </defs>

  <rect width="1200" height="420" rx="32" fill="url(#bg)" />
  <circle cx="170" cy="86" r="118" fill="#0ea5e9" opacity="0.18" filter="url(#blur)" />
  <circle cx="1015" cy="308" r="136" fill="#8b5cf6" opacity="0.18" filter="url(#blur)" />
  <circle cx="905" cy="84" r="86" fill="#22d3ee" opacity="0.15" filter="url(#blur)" />

  <rect x="56" y="58" width="170" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <text x="141" y="80" fill="#e0f2fe" font-family="'Segoe UI', Arial, sans-serif" font-size="16" text-anchor="middle">Software Engineer</text>

  <text x="56" y="160" fill="#f8fafc" font-family="'Segoe UI', Arial, sans-serif" font-size="56" font-weight="700">Firaol</text>
  <text x="56" y="208" fill="#bfdbfe" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600">Resilient systems • real-time products • practical impact</text>

  <text x="56" y="258" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="22">Backend architecture, distributed services, careful data flow,</text>
  <text x="56" y="290" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="22">and responsive web/mobile experiences built for concrete needs.</text>

  <g transform="translate(56 332)">
    <rect width="190" height="34" rx="17" fill="#082f49" stroke="#22d3ee" stroke-width="1.2" />
    <text x="95" y="22" fill="#cffafe" font-family="'Segoe UI', Arial, sans-serif" font-size="16" text-anchor="middle">Go • NestJS • Redis</text>
  </g>
  <g transform="translate(260 332)">
    <rect width="214" height="34" rx="17" fill="#172554" stroke="#60a5fa" stroke-width="1.2" />
    <text x="107" y="22" fill="#dbeafe" font-family="'Segoe UI', Arial, sans-serif" font-size="16" text-anchor="middle">PostgreSQL • MySQL</text>
  </g>
  <g transform="translate(490 332)">
    <rect width="224" height="34" rx="17" fill="#312e81" stroke="#a78bfa" stroke-width="1.2" />
    <text x="112" y="22" fill="#ede9fe" font-family="'Segoe UI', Arial, sans-serif" font-size="16" text-anchor="middle">Next.js • Flutter • Linux</text>
  </g>

  <g transform="translate(808 84)">
    <rect width="320" height="214" rx="24" fill="#081226" opacity="0.92" stroke="url(#accent)" stroke-width="1.5" />
    <text x="28" y="48" fill="#f8fafc" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700">Engineering priorities</text>
    <text x="28" y="86" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="19">• Reliable transactions and clean API contracts</text>
    <text x="28" y="118" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="19">• Low-latency messaging and predictable clients</text>
    <text x="28" y="150" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="19">• Reproducible workflows with Docker and terminals</text>
    <text x="28" y="182" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="19">• Thoughtful use of AI-assisted tooling</text>
  </g>
</svg>
